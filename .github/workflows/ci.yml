name: CI Qualidade

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qualidade:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verificar lint com Ruff
        run: ruff check .

      - name: Verificar tipagem estática com MyPy
        run: mypy src tests

      - name: Executar suíte de testes com Pytest
        run: pytest -v

      - name: Validar Quality Gate em modo controlado
        run: python -m agente.validacao_ci

[project]
name = "agente-extrato-evals"
version = "0.1.0"
description = "Mini projeto de estudo: extração tipada com LLM e Evals com gate de qualidade"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "openai>=3.53.0",
    "python-dotenv>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff",
    "mypy",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
